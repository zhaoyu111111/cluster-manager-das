# 节名：通过 --baseline-profile 选择；型号和拓扑由配置声明。
# format_version：格式版本；error_pct：允许性能下降百分比，可在各节覆盖。
# kind：supernode_hyswitch=超节点，other=普通节点；gpu_model：卡型号。
# supernode_capacity_gpus：各超节点总卡数；逗号分隔表示跨多个超节点。
# nodes_per_supernode：各超节点参与的主机名数量，与容量列表顺序对应。
# node_count：普通节点参与数量；gpus_per_node：每个主机名参与的卡数。
# all_reduce 等十项：busbw 峰值基准（GB/s）；TBD 表示未标定，不能用于测试。
# 性能低于 基准 × (1 - error_pct/100) 时失败；fabric_profile 仅作注释。

[defaults]
format_version = 2
error_pct = 3

[supernode_bw1300_40_local2]
kind = supernode_hyswitch
gpu_model = BW1300_LC
supernode_capacity_gpus = 40
nodes_per_supernode = 1
gpus_per_node = 2
